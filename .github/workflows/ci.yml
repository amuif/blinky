name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Size budget (10 kB gzipped)
        run: pnpm size
      - name: Install Chromium for the bench
        run: pnpm --filter bench exec playwright install --with-deps chromium
      - name: Performance budgets (500-avatar bench)
        run: pnpm bench
